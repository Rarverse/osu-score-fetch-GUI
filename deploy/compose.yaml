# Project name is fixed so Portainer and `docker compose` from any directory
# manage the same containers and the osu-data volume.
name: osu-score-api

# Ports and the bind address come from .env.deploy. Do not put a one-off pair
# such as 1221/4463 here: the deploy job overwrites this file and only
# preserves .env.deploy.
#
# web publishes HTTP only. Host 443 is not published unless COMPOSE_PROFILES
# includes `direct` (see https-publish). SafeLine keeps 443 when that profile
# is off. Compose applies COMPOSE_PROFILES from --env-file.
services:
  api:
    image: ghcr.io/rarverse/osu-score-fetch-gui-api:${IMAGE_TAG:?set IMAGE_TAG}
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file:
      - /etc/osu-score-api/env
    environment:
      CACHE_PATH: /var/lib/osu-score-api/cache
      STATS_PATH: /var/lib/osu-score-api/stats/usage.json
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.31.210.10}
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --workers
      - "1"
      - --no-access-log
      - --proxy-headers
      - --forwarded-allow-ips
      - ${FORWARDED_ALLOW_IPS:-172.31.210.10}
    networks:
      - backend
    volumes:
      - osu-data:/var/lib/osu-score-api
    restart: unless-stopped

  web:
    image: ghcr.io/rarverse/osu-score-fetch-gui-web:${IMAGE_TAG:?set IMAGE_TAG}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-}
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN}
      # Public port written into the HTTP→HTTPS Location. Defaults to the
      # published HTTPS_PORT, then 443. Caddy omits the port when it is 443.
      PUBLIC_HTTPS_PORT: ${PUBLIC_HTTPS_PORT:-${HTTPS_PORT:-443}}
      CADDY_MODE: ${CADDY_MODE:-direct}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1 ${COMPOSE_GATEWAY:-172.31.210.1}}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-80}:80"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      # Proxy mode leaves TLS_CERT_DIR unset and mounts the named volume.
      # That volume is not a certificate store. Direct mode sets TLS_CERT_DIR
      # to the host directory that holds fullchain.pem and privkey.pem.
      - ${TLS_CERT_DIR:-caddy-config}:/certs:ro
    networks:
      backend:
        ipv4_address: ${WEB_IPV4:-172.31.210.10}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Direct mode only. Started when .env.deploy contains COMPOSE_PROFILES=direct.
  # Forwards the published HTTPS port to Caddy's container port 443 without
  # publishing 443 from `web`. Proxy mode leaves the profile unset, so this
  # container does not exist and host 443 stays free.
  https-publish:
    profiles: ["direct"]
    image: ghcr.io/rarverse/osu-score-fetch-gui-api:${IMAGE_TAG:?set IMAGE_TAG}
    entrypoint: ["python", "-c"]
    command:
      - |
        import os, select, socket, threading

        def pipe(left, right):
            socks = [left, right]
            try:
                while socks:
                    ready, _, _ = select.select(socks, [], [])
                    for src in ready:
                        if src not in socks:
                            continue
                        dst = right if src is left else left
                        data = src.recv(65536)
                        if not data:
                            socks.remove(src)
                            try:
                                dst.shutdown(socket.SHUT_WR)
                            except OSError:
                                pass
                            continue
                        dst.sendall(data)
            finally:
                for item in (left, right):
                    try:
                        item.close()
                    except OSError:
                        pass

        def serve():
            server = socket.socket()
            server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
            server.bind(("0.0.0.0", 8443))
            server.listen(128)
            host = os.environ.get("WEB_HOST", "web")
            while True:
                client, _ = server.accept()
                try:
                    upstream = socket.create_connection((host, 443), 10)
                except OSError:
                    client.close()
                    continue
                threading.Thread(target=pipe, args=(client, upstream), daemon=True).start()

        serve()
    environment:
      WEB_HOST: web
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${HTTPS_PORT:-443}:8443"
    networks:
      - backend
    depends_on:
      web:
        condition: service_started
    healthcheck:
      disable: true
    restart: unless-stopped

networks:
  backend:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.31.210.0/24}
          gateway: ${COMPOSE_GATEWAY:-172.31.210.1}

volumes:
  osu-data:
  caddy-data:
  caddy-config:
