# Ports and the bind address come from .env.deploy. Defaults are 80 and 443
# on 0.0.0.0. Do not put a one-off pair such as 1221/4463 here: the deploy job
# overwrites this file and only preserves .env.deploy.
# BIND_ADDR is an IPv4 address (0.0.0.0 or 127.0.0.1).
services:
  api:
    image: ghcr.io/rarverse/osu-score-fetch-gui-api:${IMAGE_TAG:?set IMAGE_TAG}
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file:
      - /etc/osu-score-api/env
    environment:
      CACHE_PATH: /var/lib/osu-score-api/cache
      STATS_PATH: /var/lib/osu-score-api/stats/usage.json
    volumes:
      - osu-data:/var/lib/osu-score-api
    restart: unless-stopped

  web:
    image: ghcr.io/rarverse/osu-score-fetch-gui-web:${IMAGE_TAG:?set IMAGE_TAG}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-}
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN}
      # Public port written into the HTTP→HTTPS Location. Defaults to the
      # published HTTPS_PORT, then 443. Caddy omits the port when it is 443.
      PUBLIC_HTTPS_PORT: ${PUBLIC_HTTPS_PORT:-${HTTPS_PORT:-443}}
      CADDY_MODE: ${CADDY_MODE:-direct}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDR:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ${TLS_CERT_DIR:-./certs}:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  osu-data:
  caddy-data:
  caddy-config:
