# Plain HTTP only. Your external reverse proxy manages HTTPS and certificates.
upstream osu_api {
    zone osu_api 256k;
    # Re-resolve the API after Docker recreates its container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server api:8000 resolve;
}

log_format safe_json escape=json '{'
    '"time":"$time_iso8601",'
    '"level":"INFO",'
    '"service":"web",'
    '"event":"http_request_completed",'
    '"message":"HTTP request completed",'
    '"method":"$request_method",'
    '"route_group":"$route_group",'
    '"status":$status,'
    '"duration_seconds":$request_time,'
    '"upstream_status":"$upstream_status"'
    '}';

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Query paths contain player names. This format intentionally omits paths,
    # query strings, IPs, referrers, and user agents.
    set $route_group "frontend";
    access_log /dev/stdout safe_json;
    error_log /dev/stderr warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # real-ip.conf resolves the last non-trusted address in X-Forwarded-For.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;

    location ^~ /api/ {
        set $route_group "api";
        proxy_pass http://osu_api;
    }

    location = /health {
        set $route_group "health";
        proxy_pass http://osu_api;
    }

    location ^~ /assets/ {
        access_log off;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(svg|png|ico|webp|woff2)$ {
        access_log off;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
