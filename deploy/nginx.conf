# Plain HTTP only. Your external reverse proxy manages HTTPS and certificates.
upstream osu_api {
    zone osu_api 256k;
    # Re-resolve the API after Docker recreates its container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server api:8000 resolve;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Query paths contain player names; keep them out of access logs.
    access_log off;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # real-ip.conf resolves the last non-trusted address in X-Forwarded-For.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;

    location ^~ /api/ {
        proxy_pass http://osu_api;
    }

    location = /health {
        proxy_pass http://osu_api;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Referrer-Policy "no-referrer" always;
    }

    location ~* \.(svg|png|ico|webp|woff2)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        add_header Referrer-Policy "no-referrer" always;
    }

    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
