global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api
    metrics_path: /internal/metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: blackbox-services
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://web/health"]
        labels:
          monitor_name: web
      - targets: ["http://api:8000/health"]
        labels:
          monitor_name: api-health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox-upstream
    metrics_path: /probe
    params:
      module: [http_api_reachable]
    static_configs:
      - targets: ["https://osu.ppy.sh/api/v2"]
        labels:
          monitor_name: osu-api
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
