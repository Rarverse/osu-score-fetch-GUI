# Source deployment: run `docker compose up -d` from the repository root.
# TLS terminates at your external reverse proxy, upstream http://127.0.0.1:8080.
name: osu-score-api

services:
  api:
    build: apps/api
    env_file:
      - path: ${API_ENV_FILE:-.env}
        required: false
    environment:
      CACHE_PATH: /var/lib/osu-score-api/cache
      STATS_PATH: /var/lib/osu-score-api/stats/usage.json
      FORWARDED_ALLOW_IPS: ${WEB_IPV4:-172.31.210.10}
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --workers
      - "1"
      - --no-access-log
      - --proxy-headers
      - --forwarded-allow-ips
      - ${WEB_IPV4:-172.31.210.10}
    networks:
      - backend
    volumes:
      - osu-data:/var/lib/osu-score-api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-}
    environment:
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1 ${COMPOSE_GATEWAY:-172.31.210.1}}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    networks:
      backend:
        ipv4_address: ${WEB_IPV4:-172.31.210.10}
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    profiles: ["admin"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-raru}
      POSTGRES_USER: ${POSTGRES_USER:-raru}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    networks:
      - backend
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  loki:
    image: grafana/loki:3.6.16
    profiles: ["admin"]
    command: ["-config.file=/etc/loki/config.yaml"]
    networks:
      - backend
    volumes:
      - ./deploy/observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.21.2
    profiles: ["admin"]
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy"]
    networks:
      - backend
    volumes:
      - ./deploy/observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy
    depends_on:
      - loki
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    profiles: ["admin"]
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    networks:
      - backend
    volumes:
      - ./deploy/observability/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["admin"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    networks:
      - backend
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
      - blackbox
      - loki
    restart: unless-stopped

networks:
  backend:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.31.210.0/24}
          gateway: ${COMPOSE_GATEWAY:-172.31.210.1}

volumes:
  osu-data:
  postgres-data:
  loki-data:
  alloy-data:
  prometheus-data:
