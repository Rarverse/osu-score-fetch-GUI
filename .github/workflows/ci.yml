name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck --workspace apps/web

      - name: Lint
        run: npm run lint --workspace apps/web

      - name: Test
        run: npm test

      - name: Build
        run: npm run build --workspace apps/web

  api:
    name: api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: |
            apps/api/pyproject.toml
            apps/api/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      # OSU_CLIENT_ID and OSU_CLIENT_SECRET stay unset. No secrets.
      # test_api_error_contract expects NOT_CONFIGURED and fails if either is set.
      - name: Test
        run: env -u OSU_CLIENT_ID -u OSU_CLIENT_SECRET uv run pytest

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Review dependencies
        id: review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      # The action step continues on error so this step can tell a missing
      # dependency graph / Advanced Security response from a real finding.
      # High-severity results still fail the job.
      - name: Fail unless dependency review could not run
        if: steps.review.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/dependency-review.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}")
          if [ "$code" = "403" ]; then
            echo "Dependency review could not run (HTTP 403)."
            echo "On a private repository this requires Dependency graph and GitHub Advanced Security."
            cat /tmp/dependency-review.json
            exit 0
          fi
          echo "Dependency review failed (compare API HTTP ${code}). High-severity findings fail this job."
          cat /tmp/dependency-review.json
          exit 1

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://example.invalid' }}
    steps:
      # pull_request events check out the merge commit by default. Do not set ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Dockerfiles on this checkout
        id: dockerfiles
        run: |
          set -euo pipefail
          echo "Checked-out commit: $(git rev-parse HEAD)"
          present=true
          if [ ! -f apps/api/Dockerfile ]; then
            echo "Missing apps/api/Dockerfile on this checkout; skipping image build."
            present=false
          fi
          if [ ! -f apps/web/Dockerfile ]; then
            echo "Missing apps/web/Dockerfile on this checkout; skipping image build."
            present=false
          fi
          echo "present=${present}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.dockerfiles.outputs.present == 'true'

      - name: Build API image
        if: steps.dockerfiles.outputs.present == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: osu-score-api-api:latest
          platforms: linux/amd64
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        if: steps.dockerfiles.outputs.present == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: osu-score-api-web:latest
          platforms: linux/amd64
          build-args: |
            VITE_SITE_URL=${{ env.SITE_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Start Compose and verify HTTP deployment
        if: steps.dockerfiles.outputs.present == 'true'
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker compose up -d --no-build --wait --wait-timeout 120
          docker compose exec -T web nginx -t
          python3 - <<'PY'
          import json
          import re
          from urllib.error import HTTPError
          from urllib.request import HTTPRedirectHandler, build_opener

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          client = build_opener(NoRedirect)
          origin = "http://127.0.0.1:8080"
          with client.open(origin + "/", timeout=5) as response:
              assert response.status == 200
              assert response.headers.get_content_type() == "text/html"
              assert response.headers["Cache-Control"] == "no-cache"
              html = response.read().decode()
          assets = re.findall(r'(?:src|href)="(/assets/[^"?]+)"', html)
          assert assets, "Built frontend assets missing"
          for path in assets:
              with client.open(origin + path, timeout=5) as response:
                  assert response.status == 200
                  assert response.headers.get_content_type() != "text/html"
                  assert response.headers["Cache-Control"] == "public, max-age=31536000, immutable"
          with client.open(origin + "/og.png", timeout=5) as response:
              assert response.headers.get_content_type() == "image/png"
              assert response.headers["Cache-Control"] == "public, max-age=86400"
          with client.open(origin + "/some/page", timeout=5) as response:
              assert response.read().decode() == html
              assert response.headers["Cache-Control"] == "no-cache"
          with client.open(origin + "/health", timeout=5) as response:
              assert json.load(response)["status"] == "ok"
          try:
              client.open(origin + "/api/v1/players/1/scores", timeout=5)
          except HTTPError as error:
              assert error.code == 503
              assert json.load(error)["error"]["code"] == "NOT_CONFIGURED"
          else:
              raise AssertionError("Expected unconfigured API error")
          for path, status in [
              ("/api/missing.png", 404),
              ("/api/v1/players/1/scores?mode=invalid", 422),
              ("/assets/missing.js", 404),
          ]:
              try:
                  client.open(origin + path, timeout=5)
              except HTTPError as error:
                  assert error.code == status
                  if path.startswith("/api/"):
                      assert error.headers.get_content_type() == "application/json"
              else:
                  raise AssertionError(f"Expected {status} for {path}")
          PY
          # The API can get a new IP while web stays up; Nginx must re-resolve it.
          docker compose up -d --no-build --no-deps --force-recreate --wait --wait-timeout 120 api
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health
          docker compose exec -T --user osu api python -c \
            'from pathlib import Path; Path("/var/lib/osu-score-api/cache/deploy-probe").write_text("persisted")'
          docker compose up -d --no-build --force-recreate --wait --wait-timeout 120
          docker compose exec -T --user osu api python -c \
            'from pathlib import Path; p = Path("/var/lib/osu-score-api/cache/deploy-probe"); assert p.read_text() == "persisted"; p.unlink()'

      - name: Compose logs
        if: failure() && steps.dockerfiles.outputs.present == 'true'
        run: docker compose logs --no-color --tail=100

      - name: Clean up test stack
        if: always() && steps.dockerfiles.outputs.present == 'true'
        run: docker compose down -v

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: [web, api, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      API_IMAGE: ghcr.io/rarverse/osu-score-fetch-gui-api
      WEB_IMAGE: ghcr.io/rarverse/osu-score-fetch-gui-web
      API_DOCKERFILE: ${{ vars.API_DOCKERFILE || 'apps/api/Dockerfile' }}
      WEB_DOCKERFILE: ${{ vars.WEB_DOCKERFILE || 'apps/web/Dockerfile' }}
      API_CONTEXT: ${{ vars.API_BUILD_CONTEXT || 'apps/api' }}
      WEB_CONTEXT: ${{ vars.WEB_BUILD_CONTEXT || '.' }}
      COMPOSE_FILE: ${{ vars.COMPOSE_FILE || 'deploy/compose.yaml' }}
      NGINX_CONF: ${{ vars.NGINX_CONF || 'deploy/nginx.conf' }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/osu-score-api' }}
      # deploy/compose.yaml does not publish api port 8000. Probe inside that service.
      # vars.DEPLOY_HEALTH_URL, vars.DEPLOY_HEALTH_MODE, and vars.DEPLOY_API_SERVICE still override.
      HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL || 'http://127.0.0.1:8000/health' }}
      HEALTH_MODE: ${{ vars.DEPLOY_HEALTH_MODE || 'exec' }}
      API_SERVICE: ${{ vars.DEPLOY_API_SERVICE || 'api' }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Dockerfiles
        id: dockerfiles
        run: |
          set -euo pipefail
          present=true
          for path in "$API_DOCKERFILE" "$WEB_DOCKERFILE"; do
            if [ ! -f "$path" ]; then
              echo "Missing ${path}; skipping image build and remote deploy."
              present=false
            fi
          done
          echo "present=${present}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.dockerfiles.outputs.present == 'true'

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.dockerfiles.outputs.present == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        if: steps.dockerfiles.outputs.present == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.API_CONTEXT }}
          file: ${{ env.API_DOCKERFILE }}
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push web image
        if: steps.dockerfiles.outputs.present == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.WEB_CONTEXT }}
          file: ${{ env.WEB_DOCKERFILE }}
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          build-args: |
            VITE_SITE_URL=${{ env.SITE_URL }}
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Check Compose files
        id: compose
        if: steps.dockerfiles.outputs.present == 'true'
        run: |
          set -euo pipefail
          present=true
          for path in "$COMPOSE_FILE" "$NGINX_CONF"; do
            if [ ! -f "$path" ]; then
              echo "Missing ${path}; skipping remote deploy."
              present=false
            fi
          done
          echo "present=${present}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        if: steps.compose.outputs.present == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]; then
            echo "DEPLOY_HOST is missing or has unsupported characters"
            exit 1
          fi
          if [[ ! "$DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "DEPLOY_USER is missing or has unsupported characters"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | sed 's/\\n/\n/g' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | sed 's/\\n/\n/g' > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy with Docker Compose
        if: steps.compose.outputs.present == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "DEPLOY_DIR must be an absolute path with no spaces"
            exit 1
          fi
          case "$DEPLOY_DIR" in
            /etc|/etc/*|/var/lib|/var/lib/*)
              echo "DEPLOY_DIR must not be the server env or persistent data directory"
              exit 1
              ;;
          esac
          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "IMAGE_TAG must be the full git sha"
            exit 1
          fi
          case "$HEALTH_MODE" in
            host|exec) ;;
            *)
              echo "DEPLOY_HEALTH_MODE must be host or exec"
              exit 1
              ;;
          esac
          if [[ ! "$API_SERVICE" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "DEPLOY_API_SERVICE has unsupported characters"
            exit 1
          fi
          if [[ ! "$HEALTH_URL" =~ ^https?://[A-Za-z0-9._:-]+(/[A-Za-z0-9._~:/?#@!$\&\'\(\)*+,;=%-]*)?$ ]]; then
            echo "DEPLOY_HEALTH_URL must be an http(s) URL"
            exit 1
          fi
          stage="${DEPLOY_DIR}/.incoming-${IMAGE_TAG}"
          ssh deploy "mkdir -p $(printf '%q' "$stage")"
          scp "$COMPOSE_FILE" "deploy:${stage}/compose.yaml"
          scp "$NGINX_CONF" "deploy:${stage}/nginx.conf"
          ssh deploy "bash -s" -- "$DEPLOY_DIR" "$IMAGE_TAG" "$HEALTH_MODE" "$HEALTH_URL" "$API_SERVICE" < deploy/deploy.sh
